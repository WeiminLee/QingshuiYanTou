# 清水投研基础设施 — chemagent 落位版（2026-10-12）
# 数据一律落 /data（500Gi 数据盘，AGENTS.md 2026-10-12 铁律）
# 宿主端口只绑 127.0.0.1；容器间走 qingshui_net 按服务名互访

services:
  mongo:
    image: mongo:7
    container_name: qingshui_mongo
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "2"]
    volumes:
      - /data/qingshui/mongo:/data/db
    ports:
      - "127.0.0.1:27018:27017"
    networks: [qingshui_net]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1})"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15
    container_name: qingshui_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: qingshui
      POSTGRES_USER: qingshui
      POSTGRES_PASSWORD: qingshui123
    volumes:
      - /data/qingshui/pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    networks: [qingshui_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qingshui -d qingshui"]
      interval: 15s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qingshui_qdrant
    restart: unless-stopped
    volumes:
      - /data/qingshui/qdrant:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    networks: [qingshui_net]

  redis:
    image: redis:7
    container_name: qingshui_redis
    restart: unless-stopped
    volumes:
      - /data/qingshui/redis:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks: [qingshui_net]


  backend:
    build:
      context: /root/code/QingShuiYanTou/backend
      args:
        PIP_INDEX_URL: https://mirrors.cloud.tencent.com/pypi/simple
    image: qingshui-backend:chemagent
    container_name: qingshui_backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: /root/code/QingShuiYanTou/backend/.env
    environment:
      - KNOWLEDGE_BASE_URL=http://qingshui_backend:8000
    volumes:
      - /data/qingshui/pdf:/data/qingshui/pdf
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks: [qingshui_net]

  data-mcp:
    image: qingshui-backend:chemagent
    container_name: qingshui_data_mcp
    restart: unless-stopped
    command: python -m app.mcp_data.server --transport streamable-http --host 0.0.0.0 --port 8100
    env_file: /root/code/QingShuiYanTou/backend/.env
    environment:
      - KNOWLEDGE_BASE_URL=http://qingshui_backend:8000
    ports:
      - "127.0.0.1:8100:8100"
    depends_on:
      - backend
    networks: [qingshui_net]

  scheduler:
    image: qingshui-backend:chemagent
    container_name: qingshui_scheduler
    restart: unless-stopped
    command: ["python", "/usr/local/bin/scheduler_entrypoint.py"]
    env_file: /root/code/QingShuiYanTou/backend/.env
    environment:
      - KNOWLEDGE_BASE_URL=http://qingshui_backend:8000
      # 启动时从 endpoints.json 解析自部署 GPU（rjob 写入），不可达再回落网关
      - GPU_ENDPOINTS_FILE=/data/qingshui/endpoints.json
      - GPU_LLM_MODEL=Qwen3.6-35B-A3B
      - http_proxy=http://httpproxy-headless.kubebrain.svc.pjlab.local:3128
      - https_proxy=http://httpproxy-headless.kubebrain.svc.pjlab.local:3128
      - no_proxy=127.0.0.1,localhost,qingshui_mongo,qingshui_postgres,qingshui_qdrant,qingshui_redis,qingshui_backend,.pjlab.org.cn,10.0.0.0/8,100.96.0.0/12
    volumes:
      - /data/qingshui/pdf:/data/qingshui/pdf
      - /mnt/shared-storage-user/liweimin/qingshui/endpoints.json:/data/qingshui/endpoints.json:ro
      - /root/code/QingShuiYanTou/backend/scripts/scheduler_entrypoint.py:/usr/local/bin/scheduler_entrypoint.py:ro
    depends_on:
      - backend
    networks: [qingshui_net]

networks:
  qingshui_net:
    name: qingshui_net
