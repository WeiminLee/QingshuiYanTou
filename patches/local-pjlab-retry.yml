# 本地：pjlab 网关限流耐心版（cordis patch config 为整体替换语义，providers.qingshui 写全）。
- id: llm-pi-ai
  config:
    providers:
      qingshui:
        displayName: pjlab Gateway
        apiKeyEnv: OPENAI_API_KEY
        api: openai-completions
        baseURL: https://token.pjlab.org.cn/v1
        compat:
          thinkingFormat: deepseek
        retryPolicy:
          mode: normal
          maxRetries: 40
          retryableCodes: [EMPTY_RESPONSE, RATE_LIMIT, SERVER, TIMEOUT, TRANSPORT]
          backoff:
            initialDelayMs: 2000
            maxDelayMs: 30000
            jitterRatio: 0.2
        models:
          - id: glm-5.3
            name: GLM 5.3
            contextWindow: 131072
            maxTokens: 32768
          - id: deepseek-v4-flash
            name: DeepSeek V4 Flash
            contextWindow: 131072
            maxTokens: 8192
          # Boyue 35.220.164.252:3888 对现有 OPENAI_API_KEY 返回 401。
          # 这个 id 在 pjlab /v1/models 里，短请求已返回。
          - id: deepseek-v4-flash-0731
            name: DeepSeek V4 Flash 0731
            contextWindow: 131072
            maxTokens: 8192
- id: agent-default-model
  config:
    provider: qingshui
    model: deepseek-v4-flash-0731
