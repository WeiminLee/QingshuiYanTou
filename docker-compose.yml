services:
  # ── 基础设施 ──────────────────────────────────────────

  neo4j:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/neo4j:latest
    container_name: qingshui_neo4j
    ports:
      - "7474:7474"   # HTTP - Browser UI
      - "7687:7687"   # Bolt - Cypher query protocol
    environment:
      - NEO4J_AUTH=neo4j/qingshui123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2g
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/import
    restart: unless-stopped
    networks:
      - qingshui-net

  postgres:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/postgres:15
    container_name: qingshui_postgres
    environment:
      - POSTGRES_DB=qingshui
      - POSTGRES_USER=qingshui
      - POSTGRES_PASSWORD=qingshui123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qingshui"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - qingshui-net

  mongo:
    image: mongo:7
    container_name: qingshui_mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - qingshui-net

  qdrant:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/qdrant/qdrant:latest
    container_name: qingshui_qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - qingshui-net

  # ── 应用服务 ────────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    container_name: qingshui_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    # 所有可变变量通过 ${VAR:-default} 映射，由 --env-file backend/.env 注入；
    # 不设 env_file 指令，避免 env_file 与 environment 段的优先级冲突。
    # 密钥通过 --env-file 传入，不进镜像层（.dockerignore 已排除 .env）。
    environment:
      # LLM
      - LLM_API_KEY=${LLM_API_KEY:-your_llm_api_key_here}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api-int.memtensor.cn/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-v4-flash}
      # Embedding（通过 --env-file backend/.env 传入）
      - EMBEDDING_BACKEND=${EMBEDDING_BACKEND:-openai}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-http://100.65.0.118:8000/v1}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-qwen3-embedding:4b}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-2560}
      - HUNYUAN_API_KEY=${HUNYUAN_API_KEY:-}
      # API 认证
      - API_KEY=${API_KEY:-dev-docker-key}
      # 数据库
      - DATABASE_URL=postgresql+asyncpg://qingshui:qingshui123@postgres:5432/qingshui
      - MONGODB_URL=mongodb://mongo:27017/qingshui
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=qingshui123
      - QDRANT_URL=http://qdrant:6333
      - ENABLE_EVIDENCE_SCHEDULER=${ENABLE_EVIDENCE_SCHEDULER:-false}
      - AGENT_DATABASE_FALLBACK=${AGENT_DATABASE_FALLBACK:-false}
      # 行情与文本数据源
      - TUSHARE_TOKEN=${TUSHARE_TOKEN:-}
      - MINISHARE_IRM_TOKEN=${MINISHARE_IRM_TOKEN:-}
      - MINISHARE_ANNS_TOKEN=${MINISHARE_ANNS_TOKEN:-}
      - MINISHARE_RESEARCH_TOKEN=${MINISHARE_RESEARCH_TOKEN:-}
      # Kline/backfill scope
      - BACKFILL_START_DATE=${BACKFILL_START_DATE:-20240101}
      - BACKFILL_END_DATE=${BACKFILL_END_DATE:-}
      - BACKFILL_SCOPE=${BACKFILL_SCOPE:-tech_mvp}
      - BACKFILL_WHITELIST_FILE=${BACKFILL_WHITELIST_FILE:-}
      # 账号
      - MASTER_PASSWORD=${MASTER_PASSWORD:-dev-docker-password}
      - ACCOUNT_TOKEN_SECRET_SALT=${ACCOUNT_TOKEN_SECRET_SALT:-dev-docker-salt}
      # 调度器
      - ENABLE_API_SCHEDULER=${ENABLE_API_SCHEDULER:-false}
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8080:8000"
    networks:
      - qingshui-net

  scheduler:
    profiles:
      - cloud-ingestion
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    container_name: qingshui_scheduler
    command: python -m app.data_pipeline.scheduler
    environment:
      # LLM
      - LLM_API_KEY=${LLM_API_KEY:-your_llm_api_key_here}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api-int.memtensor.cn/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-v4-flash}
      # Embedding（qwen3-embedding:4b）
      - EMBEDDING_BACKEND=${EMBEDDING_BACKEND:-openai}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-http://100.65.0.118:8000/v1}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-qwen3-embedding:4b}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-2560}
      - HUNYUAN_API_KEY=${HUNYUAN_API_KEY:-}
      # API 认证
      - API_KEY=${API_KEY:-dev-docker-key}
      # 数据库
      - DATABASE_URL=postgresql+asyncpg://qingshui:qingshui123@postgres:5432/qingshui
      - MONGODB_URL=mongodb://mongo:27017/qingshui
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=qingshui123
      - QDRANT_URL=http://qdrant:6333
      # 行情与文本数据源
      - TUSHARE_TOKEN=${TUSHARE_TOKEN:-}
      - MINISHARE_IRM_TOKEN=${MINISHARE_IRM_TOKEN:-}
      - MINISHARE_ANNS_TOKEN=${MINISHARE_ANNS_TOKEN:-}
      - MINISHARE_RESEARCH_TOKEN=${MINISHARE_RESEARCH_TOKEN:-}
      # Kline/backfill scope
      - BACKFILL_START_DATE=${BACKFILL_START_DATE:-20240101}
      - BACKFILL_END_DATE=${BACKFILL_END_DATE:-}
      - BACKFILL_SCOPE=${BACKFILL_SCOPE:-tech_mvp}
      - BACKFILL_WHITELIST_FILE=${BACKFILL_WHITELIST_FILE:-}
      # 账号
      - MASTER_PASSWORD=${MASTER_PASSWORD:-dev-docker-password}
      - ACCOUNT_TOKEN_SECRET_SALT=${ACCOUNT_TOKEN_SECRET_SALT:-dev-docker-salt}
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - qingshui-net

  job-worker:
    profiles:
      - cloud-ingestion
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    # job-worker 使用 replicas: 2，不设固定 container_name（Docker 自动分配唯一名）
    deploy:
      replicas: 2
    command: python scripts/ingestion_worker.py --interval 5 --limit 20 --timeout 300
    environment:
      # LLM
      - LLM_API_KEY=${LLM_API_KEY:-your_llm_api_key_here}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api-int.memtensor.cn/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-v4-flash}
      # Embedding（qwen3-embedding:4b）
      - EMBEDDING_BACKEND=${EMBEDDING_BACKEND:-openai}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-http://100.65.0.118:8000/v1}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-qwen3-embedding:4b}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-2560}
      - HUNYUAN_API_KEY=${HUNYUAN_API_KEY:-}
      # API 认证
      - API_KEY=${API_KEY:-dev-docker-key}
      # 数据库
      - DATABASE_URL=postgresql+asyncpg://qingshui:qingshui123@postgres:5432/qingshui
      - MONGODB_URL=mongodb://mongo:27017/qingshui
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=qingshui123
      - QDRANT_URL=http://qdrant:6333
      # 行情与文本数据源
      - TUSHARE_TOKEN=${TUSHARE_TOKEN:-}
      - MINISHARE_IRM_TOKEN=${MINISHARE_IRM_TOKEN:-}
      - MINISHARE_ANNS_TOKEN=${MINISHARE_ANNS_TOKEN:-}
      - MINISHARE_RESEARCH_TOKEN=${MINISHARE_RESEARCH_TOKEN:-}
      # Kline/backfill scope
      - BACKFILL_START_DATE=${BACKFILL_START_DATE:-20240101}
      - BACKFILL_END_DATE=${BACKFILL_END_DATE:-}
      - BACKFILL_SCOPE=${BACKFILL_SCOPE:-tech_mvp}
      - BACKFILL_WHITELIST_FILE=${BACKFILL_WHITELIST_FILE:-}
      # 账号
      - MASTER_PASSWORD=${MASTER_PASSWORD:-dev-docker-password}
      - ACCOUNT_TOKEN_SECRET_SALT=${ACCOUNT_TOKEN_SECRET_SALT:-dev-docker-salt}
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - qingshui-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qingshui_frontend
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - qingshui-net

networks:
  qingshui-net:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  postgres_data:
  mongo_data:
  qdrant_data:
