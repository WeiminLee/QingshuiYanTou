- insert:
    - id: qingshui
      name: qingshui
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      qingshui:
        displayName: Boyue Gateway
        apiKeyEnv: OPENAI_API_KEY
        api: openai-completions
        baseURL: http://35.220.164.252:3888/v1
        compat:
          thinkingFormat: deepseek
        models:
          - id: deepseek-v4-flash
            name: DeepSeek V4 Flash
            contextWindow: 131072
            maxTokens: 8192
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: qingshui
    model: deepseek-v4-flash

# ── Research shell chrome (design §6): remove workspace entry + coding panels ──
# Must disable — entry gate (UI). Keep host `directory-picker` ENABLED:
# apiproxy injects/waits on service `directoryPicker`; disabling the host row
# crash-loops boot. Entry safety = no ui-workspace (no picker UI / no browse calls).
- id: ui-workspace
  disabled: true

# Strong hide — coding chrome (non-research entry)
- id: ui-goal
  disabled: true
- id: ui-plan
  disabled: true
- id: ui-jobs
  disabled: true
- id: ui-subagent
  disabled: true
- id: ui-workflow-run
  disabled: true
- id: ui-deliverables
  disabled: true
- id: ui-trajectory
  disabled: true
- id: ui-reference
  disabled: true
- id: file-reference-local
  disabled: true
- id: ui-agent-preset
  disabled: true
- id: ui-attachment
  disabled: true

# ── Public nginx Host trust (cloud http://124.221.188.38/) ──
# dsh /api fence requires Host ∈ loopback ∪ trustedHosts. nginx keeps
# `proxy_set_header Host $host` (do NOT rewrite to 127.0.0.1 — that would
# make PRIVILEGED methods look loopback and unlock settings/credentials).
# pickDirectory / settings / credentials stay loopback-only via dsh.
# Force native directory-picker so host.listDirectory/createDirectory are
# unavailable (auto→browse would answer listings for any trusted Host).
- id: connection
  config:
    trustedHosts: !!js ['124.221.188.38', ...ctx.webRuntime.trustedHosts]
- id: directory-picker
  name: '@deepseek-ai/dsh-host-directory-picker-native'
